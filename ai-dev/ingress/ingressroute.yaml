---
# Traefik IngressRoute for vLLM OpenAI-compatible API
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: code-llm-api
  namespace: ai-dev
  labels:
    app: vllm
  annotations:
    description: "OpenAI-compatible API for fine-tuned coding LLM"
spec:
  entryPoints:
    - websecure

  routes:
  - match: Host(`code-llm.archer.casa`)
    kind: Rule
    services:
    - name: vllm-server
      port: 8000
    middlewares:
    - name: api-auth
    - name: rate-limit
    - name: headers

  tls:
    certResolver: default
    # Or use specific certificate
    # secretName: code-llm-tls

---
# Middleware: Basic authentication (optional but recommended)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-auth
  namespace: ai-dev
spec:
  basicAuth:
    secret: api-auth-secret
    removeHeader: true

---
# Middleware: Rate limiting to prevent abuse
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: ai-dev
spec:
  rateLimit:
    average: 100  # Requests per second
    burst: 200
    period: 1m

---
# Middleware: Security headers
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headers
  namespace: ai-dev
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
    customResponseHeaders:
      X-Frame-Options: "DENY"
      X-Content-Type-Options: "nosniff"
      X-XSS-Protection: "1; mode=block"
      Referrer-Policy: "strict-origin-when-cross-origin"

# ---------------------------------------------------------------------------
# api-auth-secret is NOT committed with real credentials.
# Create it before deploying ingress (deploy scripts enforce this):
#
#   See: ingress/example-secret.yaml
#   Docs: README.md → "Configure Secrets" / generating htpasswd
#
# Quick create:
#   htpasswd -nbB admin 'your-strong-password' > /tmp/auth
#   kubectl create secret generic api-auth-secret \
#     --from-file=users=/tmp/auth -n ai-dev
#   rm -f /tmp/auth
# ---------------------------------------------------------------------------
