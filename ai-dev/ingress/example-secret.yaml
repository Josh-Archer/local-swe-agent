# Example / template Secret for Traefik basic auth.
# DO NOT commit real credentials. Copy this file locally if needed, or create
# the secret with kubectl (preferred).
#
# Generate credentials:
#   # Preferred (bcrypt): requires apache2-utils / httpd-tools
#   htpasswd -nbB admin 'your-strong-password' > /tmp/auth
#
#   # Or APR1 (openssl):
#   echo "admin:$(openssl passwd -apr1 'your-strong-password')" > /tmp/auth
#
# Create the secret (do not apply this template with placeholders):
#   kubectl create secret generic api-auth-secret \
#     --from-file=users=/tmp/auth \
#     -n ai-dev
#   rm -f /tmp/auth
#
# Verify:
#   kubectl get secret api-auth-secret -n ai-dev
#
# Optional base64 form for a hand-written Secret:
#   base64 -w0 /tmp/auth   # Linux
#   base64 /tmp/auth | tr -d '\n'  # macOS

apiVersion: v1
kind: Secret
metadata:
  name: api-auth-secret
  namespace: ai-dev
  labels:
    app: vllm
    purpose: traefik-basic-auth
  annotations:
    description: "Traefik basicAuth users file (htpasswd format)"
type: Opaque
stringData:
  # Format: one "username:hashed-password" line per user (htpasswd output).
  # REPLACE the line below with real htpasswd output before applying.
  # Deploy checks refuse placeholders and known insecure defaults.
  users: |
    REPLACE_WITH_HTPASSWD_OUTPUT
---
# Optional Sealed Secrets form (bitnami-labs/sealed-secrets).
# Encrypt a real Secret offline, then commit only the SealedSecret.
# Example structure only — encryptedData below is NOT valid ciphertext.
