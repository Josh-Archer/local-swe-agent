apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-config
  namespace: ai-dev
  labels:
    app: vllm
    component: model-config
  annotations:
    description: "Single source of truth for vLLM model identity and runtime settings. Change model via this ConfigMap + rollout of vllm-server only (no full stack redeploy). See MODEL_HOT_SWAP.md."
data:
  # ---------------------------------------------------------------------------
  # Model identity (edit these to hot-swap the served model)
  # ---------------------------------------------------------------------------
  # HuggingFace repo id used by the model-downloader init container
  MODEL_NAME: "TheBloke/deepseek-coder-6.7B-instruct-AWQ"
  # Absolute path on the model-storage PVC (init skips download if non-empty)
  MODEL_PATH: "/models/deepseek-coder-6.7b-instruct-awq"
  # Optional HF revision/tag/commit (main = latest on default branch)
  MODEL_REVISION: "main"
  # Name exposed on the OpenAI-compatible API (/v1/models, client model=)
  SERVED_MODEL_NAME: "deepseek-coder-6.7b-instruct"

  # ---------------------------------------------------------------------------
  # Runtime / performance (also ConfigMap-driven; apply + restart vLLM only)
  # ---------------------------------------------------------------------------
  GPU_MEMORY_UTILIZATION: "0.70"  # Leave headroom for Plex (AWQ uses less VRAM)
  MAX_MODEL_LEN: "8192"
  DTYPE: "auto"
  QUANTIZATION: "awq"  # awq | gptq | none (empty string disables flag usage)
  TRUST_REMOTE_CODE: "true"

  # API settings
  HOST: "0.0.0.0"
  PORT: "8000"

  # Performance tuning
  MAX_NUM_SEQS: "256"  # Batch size
  TENSOR_PARALLEL_SIZE: "1"  # Single GPU
  ENABLE_PREFIX_CACHING: "true"
  DISABLE_LOG_REQUESTS: "false"

  # ---------------------------------------------------------------------------
  # Model download script (mounted at /scripts/download-model.sh)
  # Multi-model PVC cache: each MODEL_PATH is a separate directory under /models.
  # Existing paths are reused; old models are never deleted automatically.
  # ---------------------------------------------------------------------------
  download-model.sh: |
    #!/bin/bash
    set -euo pipefail

    MODEL_NAME="${MODEL_NAME:-TheBloke/deepseek-coder-6.7B-instruct-AWQ}"
    MODEL_PATH="${MODEL_PATH:-/models/deepseek-coder-6.7b-instruct-awq}"
    MODEL_REVISION="${MODEL_REVISION:-main}"

    echo "=== Model downloader ==="
    echo "  MODEL_NAME:     $MODEL_NAME"
    echo "  MODEL_PATH:     $MODEL_PATH"
    echo "  MODEL_REVISION: $MODEL_REVISION"
    echo ""

    # Report PVC usage when df is available
    if command -v df >/dev/null 2>&1; then
      echo "PVC usage for /models:"
      df -h /models || true
      echo ""
    fi

    if [ -d "$MODEL_PATH" ] && [ -n "$(ls -A "$MODEL_PATH" 2>/dev/null || true)" ]; then
      echo "Model already present at $MODEL_PATH (cache hit) — skipping download"
      # Show a few top-level entries for operator visibility
      ls -la "$MODEL_PATH" | head -20 || true
      exit 0
    fi

    echo "Cache miss — downloading $MODEL_NAME@$MODEL_REVISION → $MODEL_PATH"
    mkdir -p "$MODEL_PATH"
    pip install -U --quiet huggingface_hub

    python3 << EOF
    from huggingface_hub import snapshot_download
    import os

    model_name = os.environ.get("MODEL_NAME", "TheBloke/deepseek-coder-6.7B-instruct-AWQ")
    model_path = os.environ.get("MODEL_PATH", "/models/deepseek-coder-6.7b-instruct-awq")
    revision = os.environ.get("MODEL_REVISION", "main")

    print(f"Downloading {model_name} (revision={revision}) to {model_path}...")
    snapshot_download(
        repo_id=model_name,
        local_dir=model_path,
        local_dir_use_symlinks=False,
        revision=revision,
    )
    print("Download complete!")
    EOF

    echo "Model download completed successfully"
    if command -v df >/dev/null 2>&1; then
      echo "PVC usage after download:"
      df -h /models || true
    fi
