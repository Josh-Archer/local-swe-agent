---
# PVC for storing base models and quantized models.
# Multi-model cache for config-driven hot-swap (see MODEL_HOT_SWAP.md):
#   - Each MODEL_PATH is a directory under /models (e.g. /models/deepseek-...)
#   - Init container skips download when MODEL_PATH is non-empty
#   - Old models are not auto-pruned; free space manually if the volume fills
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-storage
  namespace: ai-dev
  labels:
    app: vllm
    component: model-storage
  annotations:
    description: "Persistent multi-model cache for vLLM; survives pod restarts and model hot-swaps"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi  # ~4-6Gi per 7B AWQ model; size for several cached models

---
# PVC for storing LoRA adapters and checkpoints
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adapter-storage
  namespace: ai-dev
  labels:
    app: vllm
    component: adapter-storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi  # LoRA adapters are small (50-200MB each)

---
# PVC for Qdrant vector database
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-storage
  namespace: ai-dev
  labels:
    app: qdrant
    component: vector-db
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi  # Vector embeddings + metadata

---
# PVC for code indexer cache and temporary files
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: indexer-cache
  namespace: ai-dev
  labels:
    app: code-indexer
    component: cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi  # Git clones and temporary processing
