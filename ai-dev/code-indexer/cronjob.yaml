---
# HARD PREREQUISITE: the code-indexer image is build-yourself.
# It is not published to a public registry by default.
#
# Before deploy:
#   1. cd ai-dev/code-indexer
#   2. docker build -t <registry>/local-swe-agent/code-indexer:<tag> .
#   3. docker push <registry>/local-swe-agent/code-indexer:<tag>
#   4. Replace IMAGE below with that exact reference (no CHANGE_ME / YOUR_*)
#
# Published GHCR example (after CI push to master, if packages are enabled):
#   ghcr.io/josh-archer/local-swe-agent/code-indexer:latest
#
# Local / node-preloaded image (pull policy must NOT be Always):
#   code-indexer:latest
#   imagePullPolicy: IfNotPresent   # or Never
apiVersion: batch/v1
kind: CronJob
metadata:
  name: code-indexer
  namespace: ai-dev
  labels:
    app: code-indexer
spec:
  # Run daily at 2 AM
  schedule: "0 2 * * *"

  # Keep last 3 successful and 1 failed job
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

  # Job template
  jobTemplate:
    metadata:
      labels:
        app: code-indexer
    spec:
      # Allow 1 hour to complete
      activeDeadlineSeconds: 3600

      template:
        metadata:
          labels:
            app: code-indexer
        spec:
          restartPolicy: OnFailure

          containers:
          - name: indexer
            # PLACEHOLDER — replace before deploy (validate-manifests.sh will fail otherwise)
            image: ghcr.io/YOUR_ORG/local-swe-agent/code-indexer:CHANGE_ME
            # Use Always only for a tag you have actually pushed to a registry.
            # For local-only images use IfNotPresent or Never.
            imagePullPolicy: IfNotPresent
            # Image ENTRYPOINT runs index_code.py; override config via ConfigMap mount.

            env:
            - name: QDRANT_URL
              value: "http://qdrant.ai-dev.svc.cluster.local:6333"

            volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: workspace
              mountPath: /workspace
            - name: cache
              mountPath: /root/.cache

            resources:
              requests:
                memory: "2Gi"
                cpu: "1"
              limits:
                memory: "4Gi"
                cpu: "2"

          volumes:
          - name: config
            configMap:
              name: code-indexer-config
          - name: workspace
            emptyDir: {}
          - name: cache
            persistentVolumeClaim:
              claimName: indexer-cache

---
# Manual job template - create jobs from this for on-demand indexing
# Same image prerequisite as the CronJob above.
apiVersion: batch/v1
kind: Job
metadata:
  name: code-indexer-manual
  namespace: ai-dev
  labels:
    app: code-indexer
    type: manual
spec:
  activeDeadlineSeconds: 3600
  backoffLimit: 3

  template:
    metadata:
      labels:
        app: code-indexer
    spec:
      restartPolicy: OnFailure

      containers:
      - name: indexer
        # PLACEHOLDER — replace before deploy (validate-manifests.sh will fail otherwise)
        image: ghcr.io/YOUR_ORG/local-swe-agent/code-indexer:CHANGE_ME
        imagePullPolicy: IfNotPresent

        env:
        - name: QDRANT_URL
          value: "http://qdrant.ai-dev.svc.cluster.local:6333"

        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
        - name: workspace
          mountPath: /workspace
        - name: cache
          mountPath: /root/.cache

        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"

      volumes:
      - name: config
        configMap:
          name: code-indexer-config
      - name: workspace
        emptyDir: {}
      - name: cache
        persistentVolumeClaim:
          claimName: indexer-cache
