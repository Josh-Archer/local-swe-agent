name: Docker Build & Test

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'ai-dev/code-indexer/Dockerfile'
      - 'ai-dev/code-indexer/*.py'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'ai-dev/code-indexer/Dockerfile'
      - 'ai-dev/code-indexer/*.py'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/code-indexer

jobs:
  build-and-test:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # Single-platform load for local smoke/trivy (multi-platform cannot use load: true).
      - name: Build Docker image (amd64 smoke)
        uses: docker/build-push-action@v5
        with:
          context: ./ai-dev/code-indexer
          file: ./ai-dev/code-indexer/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: code-indexer:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ENTRYPOINT is the indexer; override it so CI does not need Qdrant/network.
      - name: Test Docker image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python3 code-indexer:test --version
          docker run --rm --entrypoint python3 code-indexer:test -c \
            "import qdrant_client, sentence_transformers, git; print('Dependencies OK')"

      - name: Scan image with Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: code-indexer:test
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          exit-code: '0'

      - name: Upload Trivy results
        if: always() && hashFiles('trivy-image-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-image-results.sarif'

      - name: Build and push multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./ai-dev/code-indexer
          file: ./ai-dev/code-indexer/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  hadolint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ai-dev/code-indexer/Dockerfile
          failure-threshold: error
          # DL3008: unpinned apt versions are intentional on debian slim
          # DL3015: --no-install-recommends is enforced in the Dockerfile
          ignore: DL3008
