name: Python Tests

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'ai-dev/code-indexer/**'
      - 'ai-dev/tests/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'ai-dev/code-indexer/**'
      - 'ai-dev/tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-python-code:
    name: Test Python Code
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'uecb-shared' }}
    strategy:
      matrix:
        # filelock>=4.2.1 and httpx2==2.16.0 require Python >=3.11.
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'ai-dev/tests/requirements-test.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            qdrant-client==1.11.3 \
            sentence-transformers==6.2.0 \
            gitpython==3.2.1 \
            pyyaml==6.0.2 \
            transformers==5.20.2 \
            torch==2.14.1 \
            certifi==2026.10.23 \
            filelock==4.2.4 \
            httpx2==2.16.0 \
            httpcore2==2.16.0 \
            --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pytest pytest-cov pytest-mock black==26.10.1 flake8 mypy

      - name: Lint with black
        run: |
          black --check ai-dev/code-indexer/index_code.py ai-dev/code-indexer/inject_context.py ai-dev/tests/

      - name: Lint with flake8
        run: |
          flake8 ai-dev/code-indexer/ ai-dev/tests/ --max-line-length=120 --ignore=E203,W503,F841

      - name: Type check with mypy
        run: |
          mypy ai-dev/code-indexer/index_code.py --ignore-missing-imports || true

      - name: Run unit tests
        run: |
          pytest ai-dev/tests/ -v --cov=ai-dev/code-indexer --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint-python:
    name: Python Linting & Security
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'uecb-shared' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          pip install bandit pylint safety==3.2.3 requests==2.34.2

      - name: Run bandit security linter
        run: |
          bandit -r ai-dev/code-indexer/ -lll -iii

      - name: Run pylint
        run: |
          pip install \
            qdrant-client==1.11.3 \
            sentence-transformers==6.2.0 \
            gitpython==3.2.1 \
            pyyaml==6.0.2 \
            certifi==2026.10.23 \
            filelock==4.2.4 \
            httpx2==2.16.0 \
            httpcore2==2.16.0
          pylint ai-dev/code-indexer/index_code.py --disable=C,R --max-line-length=120 || true

      - name: Check dependencies for vulnerabilities
        run: |
          pip install \
            qdrant-client==1.11.3 \
            sentence-transformers==6.2.0 \
            gitpython==3.2.1 \
            pyyaml==6.0.2 \
            transformers==5.20.2 \
            torch==2.14.1 \
            certifi==2026.10.23 \
            filelock==4.2.4 \
            httpx2==2.16.0 \
            httpcore2==2.16.0 \
            --extra-index-url https://download.pytorch.org/whl/cpu
          safety check --json || true
