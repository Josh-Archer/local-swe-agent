name: CI - Validate Manifests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install kubeval
        run: |
          wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin

      - name: Validate all Kubernetes manifests
        run: |
          find ai-dev -name "*.yaml" -type f ! -name "config.yaml" | while read -r file; do
            echo "Validating $file"
            kubeval --ignore-missing-schemas "$file" || exit 1
          done

      - name: Install kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin

      - name: Validate with kubeconform (strict)
        run: |
          find ai-dev -name "*.yaml" -type f ! -name "config.yaml" | while read -r file; do
            echo "Strict validation: $file"
            kubeconform -strict -ignore-missing-schemas "$file" || exit 1
          done

      - name: Check YAML syntax
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3
        continue-on-error: true
        with:
          file_or_dir: ai-dev/
          config_data: |
            extends: default
            rules:
              line-length:
                max: 120
                level: warning
              comments:
                min-spaces-from-content: 1
              indentation:
                spaces: 2

  lint-shell-scripts:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        continue-on-error: true
        with:
          scandir: './ai-dev/scripts'

  check-security:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Trivy security scanner
        continue-on-error: true
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          scan-type: 'config'
          scan-ref: 'ai-dev/'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        continue-on-error: true
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      # Push events can resolve base==head for single-commit ranges; do not fail CI.
      - name: Check for secrets in code
        continue-on-error: true
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # main
        with:
          path: ./
          base: ${{ github.event.before || github.event.repository.default_branch }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  test-deployment-dry-run:
    name: Test Deployment (Dry Run)
    runs-on: ubuntu-latest
    needs: validate-manifests

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          cluster_name: test-cluster

      - name: Test namespace creation
        run: |
          kubectl apply -f ai-dev/namespace/namespace.yaml

      - name: Test PVC creation (dry run)
        run: |
          kubectl apply -f ai-dev/storage/pvcs.yaml --dry-run=server || true

      - name: Test deployment manifests (dry run)
        run: |
          for manifest in ai-dev/*/deployment*.yaml ai-dev/*/cronjob.yaml; do
            if [ -f "$manifest" ]; then
              echo "Testing $manifest"
              kubectl apply -f "$manifest" --dry-run=server || true
            fi
          done

      - name: Validate ConfigMaps
        run: |
          for cm in ai-dev/*/configmap.yaml ai-dev/*/*configmap.yaml; do
            if [ -f "$cm" ]; then
              echo "Testing $cm"
              kubectl apply -f "$cm" --dry-run=server
            fi
          done
